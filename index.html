<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#214c36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plan & Plate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=20261101" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20261101" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Plan your week, save your favourite recipes and shop for the whole household with Plan &amp; Plate." />
    <title>Plan & Plate</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f8f6ef;
      }

      .app-launch-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        background: #f8f6ef;
      }

      .app-launch-brand {
        width: min(70vw, 350px);
        height: auto;
        display: block;

      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-launch-screen" aria-label="Plan & Plate loading">
        <img
          class="app-launch-brand"
          src="/brand/plan-plate-wordmark.svg"
          alt="Plan & Plate"
        />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
